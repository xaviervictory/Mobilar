<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Iniciar sesión en Mobilar"
    >

    <title>Iniciar sesión | Mobilar</title>

    <link
        rel="icon"
        type="image/png"
        href="img/mobicon.png"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="login-page">


    <!-- NAVBAR -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand d-flex align-items-center" href="index.html"> 
        <img src="img/logo.png" 
        alt="Logo de Mobilar" 
        class="logo-mobilar" 
        > 
        <span> 
            MOBILAR 
        </span> 
    </a>

            <a
                href="index.html"
                class="btn btn-outline-light"
            >
                ← Volver
            </a>

        </div>

    </nav>


    <!-- LOGIN -->

    <main class="login-container">

        <div class="login-card">


            <!-- Logo -->

            <div class="login-header">

                <div class="login-logo">
                    MOBILAR
                </div>

                <p>
                    Tu espacio, tu estilo.
                </p>

            </div>


            <!-- Título -->

            <h1>
                Iniciar sesión
            </h1>

            <p class="login-description">
                Ingresá a tu cuenta para continuar.
            </p>


            <!-- FORMULARIO -->

            <form id="formulario-login">


                <!-- EMAIL -->

                <div class="mb-3">

                    <label
                        for="login-email"
                        class="form-label"
                    >
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        class="form-control"
                        placeholder="ejemplo@gmail.com"
                        required
                    >

                    <div
                        id="error-login-email"
                        class="text-danger small mt-1"
                    ></div>

                </div>


                <!-- CONTRASEÑA -->

                <div class="mb-3">

                    <label
                        for="login-password"
                        class="form-label"
                    >
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        class="form-control"
                        placeholder="Ingresá tu contraseña"
                        required
                    >

                    <div
                        id="error-login-password"
                        class="text-danger small mt-1"
                    ></div>

                </div>


                <!-- RECORDAR -->

                <div class="form-check mb-4">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="recordar-usuario"
                    >

                    <label
                        class="form-check-label"
                        for="recordar-usuario"
                    >
                        Recordarme
                    </label>

                </div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="btn btn-warning w-100 login-button"
                >
                    Iniciar sesión
                </button>


                <!-- MENSAJE -->

                <div
                    id="mensaje-login"
                    class="alert d-none mt-4"
                    role="alert"
                ></div>


            </form>


            <!-- REGISTRO -->

            <div class="login-register">

                <p>
                    ¿Todavía no tenés una cuenta?
                </p>

                <button
                    type="button"
                    id="mostrar-registro"
                    class="btn btn-outline-dark"
                >
                    Crear cuenta
                </button>

            </div>


            <!-- REGISTRO OCULTO -->

            <form
                id="formulario-registro"
                class="d-none"
            >

                <hr class="my-4">


                <h2 class="h5 fw-bold mb-3">
                    Crear cuenta
                </h2>


                <div class="mb-3">

                    <label
                        for="registro-nombre"
                        class="form-label"
                    >
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="registro-nombre"
                        class="form-control"
                        placeholder="Tu nombre"
                    >

                </div>


                <div class="mb-3">

                    <label
                        for="registro-email"
                        class="form-label"
                    >
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="registro-email"
                        class="form-control"
                        placeholder="ejemplo@gmail.com"
                    >

                </div>


                <div class="mb-3">

                    <label
                        for="registro-password"
                        class="form-label"
                    >
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="registro-password"
                        class="form-control"
                        placeholder="Mínimo 6 caracteres"
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-dark w-100"
                >
                    Crear cuenta
                </button>


                <div
                    id="mensaje-registro"
                    class="alert d-none mt-3"
                ></div>

            </form>


        </div>

    </main>


    <script src="login.js"></script>

</body>

</html>
